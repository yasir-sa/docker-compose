services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tododb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - todo-network

  server:
    build: ./server
    restart: always
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: tododb
    depends_on:
      db:
        condition: service_healthy
    networks:
      - todo-network

  client:
    build: ./client
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - server
    networks:
      - todo-network

  jenkins:
    build:
      context: ./jenkins
      dockerfile: Dockerfile
    container_name: jenkins_container
    user: root
    privileged: true
    restart: unless-stopped
    ports:
      - "8081:8080"
      - "50000:50000"
    volumes:
      - D:/jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      JAVA_TOOL_OPTIONS: "-XX:+UseSerialGC -XX:-UsePerfData -Djava.security.egd=file:/dev/./urandom -Xmx1g -Xms512m"
    security_opt:
      - seccomp:unconfined
    networks:
      - todo-network

networks:
  todo-network:
    driver: bridge

volumes:
  pgdata:
