version: '3.8'

services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tododb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - todo-network

  server:
    build: ./server
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: tododb
    depends_on:
      db:
        condition: service_healthy
    networks:
      - todo-network

  client:
    build: ./client
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - server
    networks:
      - todo-network

networks:
  todo-network:
    driver: bridge

volumes:
  pgdata:
